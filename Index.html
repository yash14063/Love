<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Bubu 💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffe6ea;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(255, 182, 193, 0.5);
      text-align: center;
      max-width: 400px;
      width: 90%;
      position: relative;
    }

    .dudu-img {
      width: 160px;
      height: 160px;
      margin-bottom: 1rem;
      border-radius: 15px;
      object-fit: cover;
    }

    h1 {
      color: #ff4d6d;
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 1rem;
      position: relative;
      min-height: 50px;
    }

    button {
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    #yesBtn {
      background-color: #ff4d6d;
      color: white;
      box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3);
    }

    #yesBtn:hover {
      transform: scale(1.1);
      background-color: #ff2a54;
    }

    #noBtn {
      background-color: #cccccc;
      color: #333;
      position: absolute;
      right: 40px;
    }

    .hidden {
      display: none;
    }

    .celebration {
      font-size: 1.2rem;
      color: #c9184a;
      line-height: 1.6;
    }

    .hearts {
      font-size: 2rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card" id="proposalCard">
    <!-- Cute asking GIF -->
    <img id="mainGif" class="dudu-img" src="https://media.tenor.com/ef39kM3tX7gAAAAC/bubu-dudu.gif" alt="Cute Bear Asking">
    
    <h1 id="question">Bubu, will you be my Forever Valentine? 🥺❤️</h1>
    
    <div class="btn-container" id="btnGroup">
      <button id="yesBtn" onclick="acceptProposal()">YES!</button>
      <button id="noBtn" onmouseover="dodgeNo()" onclick="dodgeNo()">No</button>
    </div>

    <div id="successMessage" class="hidden">
      <div class="celebration">
        YAAAAAY! I knew you'd say yes, Bubu! <br> 
        I love you so so much! 🐻💖🐼
      </div>
      <div class="hearts">💖💕🎉✨🥰</div>
    </div>
  </div>

  <script>
    // Makes the "No" button dodge the cursor
    function dodgeNo() {
      const noBtn = document.getElementById('noBtn');
      const card = document.getElementById('proposalCard');
      
      const cardRect = card.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();
      
      const maxX = cardRect.width - btnRect.width - 20;
      const maxY = cardRect.height - btnRect.height - 20;
      
      const randomX = Math.floor(Math.random() * maxX) - (cardRect.width / 2) + (btnRect.width / 2);
      const randomY = Math.floor(Math.random() * maxY) - (cardRect.height / 2) + (btnRect.height / 2);
      
      noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }

    // Handles the "Yes" click action
    function acceptProposal() {
      document.getElementById('question').classList.add('hidden');
      document.getElementById('btnGroup').classList.add('hidden');
      document.getElementById('successMessage').classList.remove('hidden');
      
      // Changes GIF to a celebration hug
      document.getElementById('mainGif').src = "https://media.tenor.com/gU814L8A_2cAAAAC/bubu-dudu-hug.gif";
    }
  </script>
</body>
</html>
